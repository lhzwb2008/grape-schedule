<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>家长端 · 小葡萄日程管家</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=5" />
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
</head>
<body class="view-parent">
  <div class="bg-wash parent" aria-hidden="true"></div>

  <section id="login-view" class="view login-view">
    <header class="login-hero">
      <div class="brand-mark parent" aria-hidden="true"><span class="seed"></span></div>
      <h1 class="brand-title">家长端</h1>
      <p class="brand-sub">日程可视 · @提醒 · 接送路程</p>
    </header>
    <div class="login-panel">
      <p class="panel-label">我是谁？（点一下进入）</p>
      <div id="member-grid" class="member-grid"></div>
      <p id="login-error" class="error hidden"></p>
      <p class="switch-link"><a href="/">← 小葡萄前台</a></p>
    </div>
  </section>

  <section id="app-view" class="view parent-app hidden">
    <header class="parent-top">
      <div>
        <div class="side-title">小葡萄日程管家</div>
        <div class="side-user" id="side-user"></div>
      </div>
      <div class="parent-top-actions">
        <button type="button" class="btn-ghost tap" id="logout-btn">切换身份</button>
      </div>
    </header>

    <div class="parent-layout">
      <section class="panel week-panel">
        <div class="panel-head">
          <div>
            <h3>本周日程</h3>
            <p class="muted" id="week-meta">可视化周视图</p>
          </div>
          <div class="week-legend" id="week-legend" aria-hidden="true"></div>
        </div>
        <div id="week-calendar" class="week-cal" role="list"></div>
      </section>

      <aside class="panel remind-panel">
        <div class="panel-head">
          <div>
            <h3>今日提醒</h3>
            <p class="muted" id="board-meta"></p>
          </div>
        </div>
        <div id="reminder-board" class="reminder-board"></div>
        <div class="places-block">
          <h4>地点与路程</h4>
          <div id="places-board" class="places-board"></div>
        </div>
      </aside>

      <section class="panel chat-panel">
        <h3>家长对话</h3>
        <p class="muted chat-hint">直接说行程就行，例如「每周三 16:00 雅马哈钢琴课，妈妈接」。管家会自动决定提醒谁。</p>
        <div class="messages compact" id="messages"></div>
        <form class="composer" id="composer">
          <textarea id="input" rows="2" placeholder="说行程、地点、接送…（不用自己写@）"></textarea>
          <button type="submit" class="btn-send tap" id="send-btn">发送</button>
        </form>
      </section>
    </div>
  </section>

  <script src="/static/parent.js?v=6"></script>
</body>
</html>
